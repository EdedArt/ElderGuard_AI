org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# The repository lives under a folder with a non-ASCII name ("Diseño"), which the Android Gradle
# Plugin refuses by default on Windows. A full clean assembleDebug was verified to work from that
# path, so the check is turned off. Remove this line if the repository moves to an ASCII-only path.
android.overridePathCheck=true
